services:
  postgres:
    image: postgres:16-alpine
    container_name: checkin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkin
      POSTGRES_PASSWORD: checkin
      POSTGRES_DB: checkin
    ports:
      - "5432:5432"
    volumes:
      - checkin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkin -d checkin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  checkin_pgdata:
